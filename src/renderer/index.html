<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:"
    />
    <title>RushHour</title>
    <style>
        html, body { margin: 0; height: 100%; background: #0b0f14; color: #9fb3c8;
            font-family: system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        #toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px;
            border-bottom: 1px solid #1c2733; }
        #city-form { display: flex; gap: 8px; }
        input, button, select { font: inherit; padding: 4px 8px; color: #dbe7f3; background: #131b24;
            border: 1px solid #1c2733; border-radius: 4px; }
        button:disabled { opacity: 0.5; }
        #status { white-space: pre-line; }
        #map { flex: 1; min-height: 0; width: 100%; }
    </style>
</head>
<body>
<div id="toolbar">
    <form id="city-form">
        <input id="city-input" type="text" placeholder="City name, e.g. Chișinău"
               autocomplete="off" required />
        <button id="load-button" type="submit">Load</button>
    </form>
    <span id="status"></span>
    <label>Vehicles
        <input id="vehicle-count" type="number" min="1" max="100000" value="2000" />
    </label>
    <button id="play-button" type="button" disabled>Play</button>
    <label>Speed
        <select id="speed-select">
            <option value="1">1×</option>
            <option value="10">10×</option>
            <option value="50" selected>50×</option>
            <option value="200">200×</option>
        </select>
    </label>
</div>
<canvas id="map"></canvas>
<script type="module" src="./main.ts"></script>
</body>
</html>
